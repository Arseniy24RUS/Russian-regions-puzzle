name: Yandex Forms quiz media export

on:
  push:
    branches:
      - yforms-source-audit-2026
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install browser client
        run: npm install --no-save playwright-core@1.55.0

      - name: Fetch survey JSON and all institution images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export/raw export/photos
          cat > export.mjs <<'JS'
          import { chromium } from 'playwright-core';
          import fs from 'node:fs/promises';
          import path from 'node:path';

          const browser = await chromium.launch({
            headless: true,
            executablePath: '/usr/bin/google-chrome',
            args: ['--no-sandbox', '--disable-dev-shm-usage'],
          });
          const context = await browser.newContext({ locale: 'ru-RU' });
          const page = await context.newPage();
          const responsePromise = page.waitForResponse(r => r.url().includes('/gateway/root/form/getSurvey') && r.status() === 200, { timeout: 60000 });
          await page.goto('https://forms.yandex.ru/cloud/68c075f9e010db424bd32329/', { waitUntil: 'domcontentloaded', timeout: 90000 });
          const response = await responsePromise;
          const survey = await response.json();
          await fs.writeFile('export/survey.json', JSON.stringify(survey, null, 2));

          const rows = [];
          for (const pageData of survey.pages.slice(1)) {
            const item = pageData.items?.[0] || {};
            const match = String(item.label || '').match(/^\s*(\d+)\.\s*(.*)$/s);
            if (!match) continue;
            const order = Number(match[1]);
            const title = match[2].trim();
            const links = item.image?.links || {};
            const url = links['2560x'] || links['1280x'] || links['720x'] || links['360x'];
            if (!url) throw new Error(`No image for ${order}. ${title}`);
            const imageResponse = await context.request.get(url, { timeout: 60000 });
            if (!imageResponse.ok()) throw new Error(`Image ${order} HTTP ${imageResponse.status()}`);
            const contentType = imageResponse.headers()['content-type'] || '';
            const ext = contentType.includes('png') ? '.png' : contentType.includes('webp') ? '.webp' : '.jpg';
            const filename = String(order).padStart(2, '0') + ext;
            await fs.writeFile(path.join('export/raw', filename), await imageResponse.body());
            rows.push({ order, title, question_id: item.id, source_url: url, source_links: links, raw_file: `raw/${filename}` });
          }
          rows.sort((a,b) => a.order - b.order);
          if (rows.length !== 50) throw new Error(`Expected 50 institution images, got ${rows.length}`);
          await fs.writeFile('export/manifest-source.json', JSON.stringify(rows, null, 2));
          await browser.close();
          JS
          node export.mjs

      - name: Normalize images and build contact sheets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps, ImageDraw, ImageFont
          import json, hashlib

          root = Path('export')
          rows = json.loads((root / 'manifest-source.json').read_text('utf-8'))
          font = ImageFont.load_default()
          for row in rows:
              src = root / row['raw_file']
              with Image.open(src) as im:
                  im = ImageOps.exif_transpose(im).convert('RGB')
                  im.thumbnail((1800, 1400), Image.Resampling.LANCZOS)
                  out = root / 'photos' / f"{row['order']:02d}.webp"
                  im.save(out, 'WEBP', quality=88, method=6)
                  row['photo_file'] = f"photos/{out.name}"
                  row['width'], row['height'] = im.size
                  row['sha256'] = hashlib.sha256(out.read_bytes()).hexdigest()

          cols, cell_w, cell_h = 4, 430, 285
          rows_per_sheet = 10
          for sheet_index, start in enumerate(range(0, len(rows), rows_per_sheet), 1):
              chunk = rows[start:start+rows_per_sheet]
              sheet_rows = (len(chunk) + cols - 1) // cols
              sheet = Image.new('RGB', (cols*cell_w, sheet_rows*cell_h), 'white')
              draw = ImageDraw.Draw(sheet)
              for j, row in enumerate(chunk):
                  x = (j % cols)*cell_w
                  y = (j // cols)*cell_h
                  with Image.open(root / row['photo_file']) as im:
                      thumb = ImageOps.fit(im.convert('RGB'), (cell_w-20, 205), Image.Resampling.LANCZOS)
                  sheet.paste(thumb, (x+10, y+10))
                  title = f"{row['order']}. {row['title']}"
                  words, lines, line = title.split(), [], ''
                  for word in words:
                      candidate = (line + ' ' + word).strip()
                      if draw.textlength(candidate, font=font) > cell_w-24 and line:
                          lines.append(line); line = word
                      else:
                          line = candidate
                  if line: lines.append(line)
                  draw.multiline_text((x+12, y+222), '\n'.join(lines[:3]), fill='black', font=font, spacing=3)
              sheet.save(root / f'contact-sheet-{sheet_index}.jpg', quality=90)

          (root / 'manifest.json').write_text(json.dumps(rows, ensure_ascii=False, indent=2), 'utf-8')
          PY

      - name: Package media
        shell: bash
        run: |
          set -euo pipefail
          cd export
          zip -r -9 ../yforms-quiz-media-50.zip .

      - name: Upload media artifact
        uses: actions/upload-artifact@v4
        with:
          name: yforms-quiz-media-50
          path: yforms-quiz-media-50.zip
          if-no-files-found: error
          retention-days: 3
