name: Current Troitsk municipal symbol

on:
  push:
    branches:
      - quiz-symbols-v071
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pillow cairosvg
      - name: Fetch and normalize the official current coat of arms
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export/assets export/raw
          URL='https://xn--h1aekhj1a.xn--p1ai/assets/img/tro-gerb.svg'
          curl --fail --location --retry 12 --retry-all-errors --retry-delay 6 \
            --connect-timeout 30 --max-time 240 \
            -A 'Mozilla/5.0 RUDN educational platform/0.7.1' \
            "$URL" -o export/raw/troitsk_moscow.svg
          python - <<'PY'
          import io,json
          from pathlib import Path
          import cairosvg
          from PIL import Image,ImageOps
          raw=Path('export/raw/troitsk_moscow.svg').read_bytes()
          png=cairosvg.svg2png(bytestring=raw,output_width=1600,output_height=1600)
          with Image.open(io.BytesIO(png)) as im:
              im=ImageOps.exif_transpose(im).convert('RGBA'); bbox=im.getbbox()
              if bbox: im=im.crop(bbox)
              im.thumbnail((1100,1100),Image.Resampling.LANCZOS)
              canvas=Image.new('RGBA',(1200,1200),(0,0,0,0)); canvas.alpha_composite(im,((1200-im.width)//2,(1200-im.height)//2))
              canvas.save('export/assets/troitsk_moscow.webp','WEBP',lossless=True,method=6)
          meta={'key':'troitsk_moscow','title':'Герб внутригородского муниципального образования — городского округа Троицк в городе Москве','source':'https://xn--h1aekhj1a.xn--p1ai/','asset_source':'https://xn--h1aekhj1a.xn--p1ai/assets/img/tro-gerb.svg','legal_source':'https://base.garant.ru/411526633/','effective_from':'2025-02-15','license':'Official municipal symbol / PD-RU-exempt','kind':'jurisdiction_coat','local_file':'assets/troitsk_moscow.webp'}
          Path('export/metadata.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2),'utf-8')
          PY
          cd export && zip -r -9 ../troitsk-current-symbol.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: troitsk-current-symbol
          path: troitsk-current-symbol.zip
          if-no-files-found: error
          retention-days: 3
