name: Exact symbol corrections v2

on:
  push:
    branches:
      - quiz-symbols-v071
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests pillow cairosvg
      - name: Download and rasterize exact symbols
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export/assets
          cat > /tmp/fetch.py <<'PY'
          import io,json,time
          from pathlib import Path
          import requests, cairosvg
          from PIL import Image,ImageOps
          S=requests.Session(); S.headers['User-Agent']='RUDN-GMU-Educational-Platform/0.7.1 exact symbol fetch'
          api='https://commons.wikimedia.org/w/api.php'
          specs={
            'omsk_oblast':'Coat of Arms of Omsk Oblast.svg',
            'krasnodar_city':'Coat of arms of Krasnodar.png',
            'samara_city':'Coat of Arms of Samara (Samara oblast).svg',
            'rosselkhoznadzor':'Emblem of the Federal Service for Veterinary and Phytosanitary Supervision.svg',
          }
          rows=[]
          for key,title in specs.items():
            r=S.get(api,params={'action':'query','format':'json','formatversion':2,'redirects':1,'titles':'File:'+title,'prop':'imageinfo','iiprop':'url|size|mime|extmetadata','iiurlwidth':1200,'iiextmetadatafilter':'LicenseShortName|LicenseUrl|Artist|Credit|ImageDescription'},timeout=45);r.raise_for_status()
            p=r.json()['query']['pages'][0]; info=p['imageinfo'][0]; meta=info.get('extmetadata') or {}
            url=info.get('thumburl') or info['url']; res=S.get(url,timeout=60); res.raise_for_status(); b=res.content
            stripped=b.lstrip()
            if stripped.startswith(b'<svg') or stripped.startswith(b'<?xml'):
              b=cairosvg.svg2png(bytestring=b,output_width=1200,output_height=1200)
            with Image.open(io.BytesIO(b)) as im:
              im=ImageOps.exif_transpose(im).convert('RGBA'); bbox=im.getbbox()
              if bbox: im=im.crop(bbox)
              im.thumbnail((900,900),Image.Resampling.LANCZOS)
              canvas=Image.new('RGBA',(960,960),(0,0,0,0)); canvas.alpha_composite(im,((960-im.width)//2,(960-im.height)//2))
              out=Path('export/assets')/f'{key}.webp'; canvas.save(out,'WEBP',lossless=True,method=6)
            rows.append({'key':key,'title':p['title'],'descriptionurl':info.get('descriptionurl'),'license':(meta.get('LicenseShortName') or {}).get('value',''),'license_url':(meta.get('LicenseUrl') or {}).get('value',''),'artist':(meta.get('Artist') or {}).get('value',''),'credit':(meta.get('Credit') or {}).get('value',''),'description':(meta.get('ImageDescription') or {}).get('value',''),'local_file':'assets/'+key+'.webp'})
            time.sleep(.6)
          url='https://www.sirius.gov.ru/local/templates/sirius_color/img/logo_footer.svg'
          r=S.get(url,timeout=60); r.raise_for_status(); raw=r.content
          b=cairosvg.svg2png(bytestring=raw,output_width=1600)
          with Image.open(io.BytesIO(b)) as im:
            im=ImageOps.exif_transpose(im).convert('RGBA'); bbox=im.getbbox()
            if bbox: im=im.crop(bbox)
            im.thumbnail((1100,700),Image.Resampling.LANCZOS)
            canvas=Image.new('RGBA',(1200,800),(0,0,0,0)); canvas.alpha_composite(im,((1200-im.width)//2,(800-im.height)//2))
            out=Path('export/assets/sirius.webp'); canvas.save(out,'WEBP',lossless=True,method=6)
          rows.append({'key':'sirius','title':'Официальный логотип федеральной территории «Сириус»','descriptionurl':'https://www.sirius.gov.ru/','license':'official-site asset; used for educational identification','license_url':'','artist':'Федеральная территория «Сириус»','credit':'Официальный сайт федеральной территории «Сириус»','description':'Логотип из официального сайта федеральной территории','local_file':'assets/sirius.webp','source_url':url})
          Path('export/metadata.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),'utf-8')
          PY
          python /tmp/fetch.py
          cd export && zip -r -9 ../exact-symbol-fixes-v2.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: exact-symbol-fixes-v2
          path: exact-symbol-fixes-v2.zip
          if-no-files-found: error
          retention-days: 3
