name: Quiz 50 institution media export

on:
  push:
    branches:
      - quiz50-media-export-2026
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install media dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pillow cairosvg

      - name: Collect Wikimedia Commons media
        run: python _quiz50/collect_media.py

      - name: Inventory
        if: always()
        run: find _quiz50/out -type f -printf '%P\t%s bytes\n' | sort > _quiz50/out/inventory.txt

      - name: Upload media audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quiz50-institution-media
          path: _quiz50/out
          if-no-files-found: error
          retention-days: 3
