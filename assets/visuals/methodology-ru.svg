<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Методика пазла регионов России</title>
  <desc id="desc">Распознавание региона переходит в точность размещения, сложность и время, затем в учебную обратную связь.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#071022"/><stop offset="1" stop-color="#102449"/></linearGradient>
    <linearGradient id="card" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#13284f"/><stop offset="1" stop-color="#0b1835"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000817" flood-opacity=".45"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#ffc75f"/></marker>
    <style>
      .title{font:700 38px Arial,sans-serif;fill:#f6f9ff}.sub{font:400 20px Arial,sans-serif;fill:#b8ccec}.h{font:700 22px Arial,sans-serif;fill:#f6f9ff}.p{font:400 17px Arial,sans-serif;fill:#cbd8ef}.foot{font:700 19px Arial,sans-serif;fill:#dbe8ff}
    </style>
  </defs>
  <rect width="1200" height="520" fill="url(#bg)"/>
  <text class="title" x="56" y="74">Методика</text>
  <text class="sub" x="56" y="110">Распознавание региона -> точность размещения -> сложность/время -> обратная связь.</text>
  <g filter="url(#shadow)">
    <g transform="translate(50 166)">
      <rect width="260" height="190" rx="8" fill="url(#card)" stroke="#ff4232" stroke-width="2"/>
      <text class="h" x="28" y="48">Распознавание</text>
      <text class="p" x="28" y="92"><tspan x="28">Память формы</tspan><tspan x="28" dy="30">Название и контур</tspan><tspan x="28" dy="30">Субъект РФ</tspan></text>
    </g>
    <g transform="translate(330 166)">
      <rect width="260" height="190" rx="8" fill="url(#card)" stroke="#39d6dc" stroke-width="2"/>
      <text class="h" x="28" y="48">Точность</text>
      <text class="p" x="28" y="92"><tspan x="28">Положение на карте</tspan><tspan x="28" dy="30">Совпадение границ</tspan><tspan x="28" dy="30">Количество ошибок</tspan></text>
    </g>
    <g transform="translate(610 166)">
      <rect width="260" height="190" rx="8" fill="url(#card)" stroke="#ffc75f" stroke-width="2"/>
      <text class="h" x="28" y="48">Сложность и время</text>
      <text class="p" x="28" y="92"><tspan x="28">3 уровня сложности</tspan><tspan x="28" dy="30">Темп выполнения</tspan><tspan x="28" dy="30">Время прохождения</tspan></text>
    </g>
    <g transform="translate(890 166)">
      <rect width="260" height="190" rx="8" fill="url(#card)" stroke="#5eeab0" stroke-width="2"/>
      <text class="h" x="28" y="48">Обратная связь</text>
      <text class="p" x="28" y="92"><tspan x="28">Разбор таблицы</tspan><tspan x="28" dy="30">Сравнение CSV</tspan><tspan x="28" dy="30">Обсуждение в группе</tspan></text>
    </g>
  </g>
  <path d="M316 260 H322" stroke="#ffc75f" stroke-width="4" marker-end="url(#arrow)"/><path d="M596 260 H602" stroke="#ffc75f" stroke-width="4" marker-end="url(#arrow)"/><path d="M876 260 H882" stroke="#ffc75f" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1020 386 C930 462 292 462 202 386" fill="none" stroke="#39d6dc" stroke-width="3" stroke-dasharray="9 10" marker-end="url(#arrow)" opacity=".9"/>
  <text class="foot" x="600" y="448" text-anchor="middle">Обратная связь возвращается к распознаванию и стратегии размещения.</text>
</svg>
